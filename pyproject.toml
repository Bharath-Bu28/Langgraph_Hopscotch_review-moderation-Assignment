[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hopscotch-review-moderation"
version = "1.0.0"
description = "LangGraph review moderation guided assignment"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.20",
  "langchain-openai==1.7.4",
  "pydantic==2.14.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]
ui = ["streamlit==1.67.0"]

[project.scripts]
hopscotch = "hopscotch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hopscotch = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
